name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  GOPRIVATE: github.com/justusschock/*

jobs:
  test:
    name: Go ${{ matrix.go-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        go-version:
          - 1.22.x
          - 1.23.x
          - 1.24.x
          - 1.25.x
          - 1.26.x

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Configure private modules
        env:
          GO_MODULES_TOKEN: ${{ secrets.GO_MODULES_TOKEN }}
        run: |
          test -n "${GO_MODULES_TOKEN}"
          git config --global url."https://x-access-token:${GO_MODULES_TOKEN}@github.com/".insteadOf "https://github.com/"

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}
          check-latest: true
          cache: false

      - name: Verify module
        run: go mod verify

      - name: Vet
        run: go vet ./...

      - name: Test with race detector
        run: go test -race -count=1 ./...
